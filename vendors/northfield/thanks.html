<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northfield Electric | Quote request received</title>
<style>
  body { margin:0; font-family:Arial, sans-serif; background:#faf7f0; color:#22302a; }
  header { border-bottom:3px double #b8893b; padding:18px; text-align:center; background:#fff; font-family:Georgia, serif; font-size:24px; color:#1f4d3a; letter-spacing:2px; text-transform:uppercase; }
  main { max-width:560px; margin:32px auto; background:#fff; border:1px solid #e2ddd0; padding:28px; }
  h1 { font-family:Georgia, serif; font-weight:normal; color:#1f4d3a; margin-top:0; }
  dl { display:grid; grid-template-columns:120px 1fr; gap:8px; }
  dt { color:#7d7a70; }
</style>
</head>
<body>
<header>Northfield Electric</header>
<main>
  <h1 id="confirm">Quote request received</h1>
  <p>Our trade desk will reply within one business day.</p>
  <dl id="echo"></dl>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const dl = document.getElementById('echo');
  for (const [k, v] of p) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); }
</script>
</body>
</html>
