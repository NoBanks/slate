<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northfield Electric | Request a quote</title>
<style>
  body { margin:0; font-family:Georgia, "Times New Roman", serif; background:#faf7f0; color:#22302a; }
  header { border-bottom:3px double #b8893b; padding:18px; text-align:center; background:#fff; font-size:24px; color:#1f4d3a; letter-spacing:2px; text-transform:uppercase; }
  header a { color:#1f4d3a; text-decoration:none; }
  form { max-width:560px; margin:32px auto; background:#fff; border:1px solid #e2ddd0; padding:28px; font-family:Arial, sans-serif; }
  h1 { margin-top:0; font-family:Georgia, serif; font-weight:normal; color:#1f4d3a; }
  label { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
  input, textarea { width:100%; padding:11px 12px; border:1px solid #cfc9b8; font-size:15px; box-sizing:border-box; font-family:inherit; }
  button { margin-top:20px; background:#1f4d3a; border:0; color:#fff; font-weight:700; padding:13px 26px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<header><a href="index.html">Northfield Electric</a></header>
<form method="GET" action="thanks.html" id="quote-form">
  <h1>Request a trade quote</h1>
  <p>Catalog NE-LP40-600: Industrial LED panel, 600x600, 40W</p>
  <input type="hidden" name="product" value="NE-LP40-600">
  <label for="name">Contact name</label><input id="name" name="name" required>
  <label for="company">Company</label><input id="company" name="company" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="qty">Quantity</label><input id="qty" name="qty" type="number" min="1" required>
  <label for="notes">Notes</label><textarea id="notes" name="notes" rows="4"></textarea>
  <button id="submit" type="submit">Request quote</button>
</form>
</body>
</html>
