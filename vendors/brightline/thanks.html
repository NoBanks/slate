<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightline Supply | Quote request received</title>
<style>
  body { margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; background:#f6f8fb; color:#1d2733; }
  header { background:#0f2a4a; color:#fff; padding:14px 24px; font-weight:700; font-size:20px; }
  main { max-width:560px; margin:32px auto; background:#fff; border:1px solid #e3e8ef; border-radius:10px; padding:28px; }
  h1 { color:#17733a; margin-top:0; }
  dl { display:grid; grid-template-columns:120px 1fr; gap:8px; font-size:15px; }
  dt { color:#5f6b7a; }
</style>
</head>
<body>
<header>Brightline Supply</header>
<main>
  <h1 id="confirm">Quote request received</h1>
  <p>Thank you. A Brightline account manager will email your formal quote within one business day.</p>
  <p>Reference: <b id="ref"></b></p>
  <dl id="echo"></dl>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const dl = document.getElementById('echo');
  for (const [k, v] of p) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); }
  document.getElementById('ref').textContent = 'BL-Q-' + (Math.abs([...location.search].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)) % 100000).toString().padStart(5, '0');
</script>
</body>
</html>
