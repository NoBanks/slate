<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightline Supply | Request a quote</title>
<style>
  body { margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; background:#f6f8fb; color:#1d2733; }
  header { background:#0f2a4a; color:#fff; padding:14px 24px; font-weight:700; font-size:20px; }
  header a { color:#fff; text-decoration:none; }
  form { max-width:560px; margin:32px auto; background:#fff; border:1px solid #e3e8ef; border-radius:10px; padding:28px; }
  h1 { margin-top:0; font-size:24px; }
  label { display:block; font-size:13px; font-weight:600; color:#5f6b7a; margin:14px 0 6px; }
  input, textarea { width:100%; padding:11px 12px; border:1px solid #cfd7e2; border-radius:6px; font-size:15px; box-sizing:border-box; font-family:inherit; }
  .prod { background:#fff8e1; padding:10px 14px; border-radius:6px; font-size:14px; }
  button { margin-top:20px; background:#ffb400; border:0; color:#1b1300; font-weight:700; padding:13px 26px; border-radius:6px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<header><a href="index.html">Brightline Supply</a></header>
<form method="GET" action="thanks.html" id="quote-form">
  <h1>Request a quote</h1>
  <div class="prod">Industrial LED panel, 600x600, 40W (SKU BL-P6640)</div>
  <input type="hidden" name="product" value="BL-P6640">
  <label for="name">Full name</label><input id="name" name="name" required>
  <label for="company">Company</label><input id="company" name="company" required>
  <label for="email">Work email</label><input id="email" name="email" type="email" required>
  <label for="qty">Quantity</label><input id="qty" name="qty" type="number" min="1" required>
  <label for="notes">Notes</label><textarea id="notes" name="notes" rows="4"></textarea>
  <button id="submit" type="submit">Submit quote request</button>
</form>
</body>
</html>
