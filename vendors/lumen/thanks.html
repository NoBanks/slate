<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Depot | Request received</title>
<style>
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:#1a1a1a; }
  header { background:#1a1a1a; color:#fff; padding:16px 24px; font-weight:900; font-size:22px; }
  header span { color:#ff6a13; }
  main { max-width:560px; margin:32px auto; padding:0 16px; }
  dl { display:grid; grid-template-columns:120px 1fr; gap:8px; }
  dt { color:#6b6b6b; }
</style>
</head>
<body>
<header>LUMEN<span>DEPOT</span></header>
<main>
  <h1 id="confirm">Quote request received</h1>
  <p>Our bulk sales team will contact you shortly.</p>
  <dl id="echo"></dl>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const dl = document.getElementById('echo');
  for (const [k, v] of p) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); }
</script>
</body>
</html>
