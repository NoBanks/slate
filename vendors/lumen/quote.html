<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Depot | Request a quote</title>
<style>
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:#1a1a1a; }
  header { background:#1a1a1a; color:#fff; padding:16px 24px; font-weight:900; font-size:22px; letter-spacing:1px; }
  header span { color:#ff6a13; }
  header a { color:#fff; text-decoration:none; }
  form { max-width:560px; margin:32px auto; border-top:4px solid #ff6a13; padding:24px 4px; }
  h1 { margin-top:0; font-size:24px; text-transform:uppercase; }
  label { display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; margin:14px 0 6px; }
  input, textarea { width:100%; padding:11px 12px; border:2px solid #d0d0d0; border-radius:2px; font-size:15px; box-sizing:border-box; font-family:inherit; }
  button { margin-top:20px; background:#ff6a13; border:0; color:#fff; font-weight:800; padding:14px 30px; border-radius:3px; font-size:15px; text-transform:uppercase; cursor:pointer; }
</style>
</head>
<body>
<header><a href="index.html">LUMEN<span>DEPOT</span></a></header>
<form method="GET" action="thanks.html" id="quote-form">
  <h1>Bulk quote request</h1>
  <p>Item LD-40PNL-66: Industrial LED panel, 600x600, 40W</p>
  <input type="hidden" name="product" value="LD-40PNL-66">
  <label for="name">Name</label><input id="name" name="name" required>
  <label for="company">Company</label><input id="company" name="company" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="qty">Quantity</label><input id="qty" name="qty" type="number" min="1" required>
  <label for="notes">Notes</label><textarea id="notes" name="notes" rows="4"></textarea>
  <button id="submit" type="submit">Send request</button>
</form>
</body>
</html>
